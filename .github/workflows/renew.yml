name: Renew TheRose

on:
  schedule:
    # 北京时间每天 08:00 运行 (UTC 00:00)，自行根据服务到期时间调整
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式（保留截图）'
        type: boolean
        default: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-noto-cjk jq wget
          pip install --upgrade pip
          pip install seleniumbase requests
          seleniumbase install chromedriver
        timeout-minutes: 5

      - name: ⚙ 设置代理（sing-box，固定节点）
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
        run: |
          xvfb-run --auto-servernum python renew_therose.py
        timeout-minutes: 10

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

      - name: 📎 上传截图（失败时保留）
        if: ${{ always() && (failure() || inputs.debug) }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: |
            *.png
          retention-days: 7
